<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打字背单词 · 计算机英语</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">TypeWords</div>
      <div class="lib-selector">
        <select id="libSelect"></select>
      </div>
      <nav style="flex:1;">
        <button class="nav-btn active" data-target="view-practice">
          <span class="icon">🎯</span><span class="text">练习</span>
        </button>
        <button class="nav-btn" data-target="view-wrongbook">
          <span class="icon">📕</span><span class="text">错题本</span>
        </button>
        <button class="nav-btn" data-target="view-mastered">
          <span class="icon">✅</span><span class="text">已掌握</span>
        </button>
        <button class="nav-btn" id="openSettingsBtn">
          <span class="icon">⚙️</span><span class="text">设置</span>
        </button>
      </nav>
      <button class="toggle-btn" id="toggleSidebar" title="折叠侧边栏">◀</button>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      
      <!-- 1. 练习视图 -->
      <div id="view-practice" class="view active">
        
        <div class="top-nav-area">
          <div class="word-nav">
            <button id="prevWordBtn" class="word-nav-btn">⬅️ <span>-</span></button>
            <button id="nextWordBtn" class="word-nav-btn">➡️ <span>-</span></button>
          </div>
          <header class="topbar">
            <span id="progress">已掌握: 0 | 错题: 0</span>
            <span id="dailyProgress">今日: 0 / 20</span>
            <span id="accuracy">剩余: 0</span>
          </header>
        </div>

        <main class="card">
          <div class="mode-tag" id="modeTag">学习模式</div>
          <p class="meaning" id="meaning">加载中…</p>
          <div class="meta-row">
            <span class="phonetic" id="phonetic"></span>
            <button class="speak-btn" id="speakBtn" type="button">🔊</button>
          </div>
          <div class="word-zone" id="wordZone">
            <div class="slots" id="slots"></div>
            <input id="hiddenInput" class="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          </div>
          <p class="hint" id="hint">输入对应的英文单词</p>
        </main>

        <footer class="actions">
          <button id="skipBtn" class="btn" type="button">跳过</button>
          <button id="nextBtn" class="btn primary" type="button" disabled>下一个</button>
        </footer>

        <!-- 手机端虚拟键盘 -->
        <div class="virtual-keyboard" id="virtualKeyboard">
          <div class="vk-row">
            <button class="vk-key" data-key="q">q</button>
            <button class="vk-key" data-key="w">w</button>
            <button class="vk-key" data-key="e">e</button>
            <button class="vk-key" data-key="r">r</button>
            <button class="vk-key" data-key="t">t</button>
            <button class="vk-key" data-key="y">y</button>
            <button class="vk-key" data-key="u">u</button>
            <button class="vk-key" data-key="i">i</button>
            <button class="vk-key" data-key="o">o</button>
            <button class="vk-key" data-key="p">p</button>
          </div>
          <div class="vk-row">
            <button class="vk-key" data-key="a">a</button>
            <button class="vk-key" data-key="s">s</button>
            <button class="vk-key" data-key="d">d</button>
            <button class="vk-key" data-key="f">f</button>
            <button class="vk-key" data-key="g">g</button>
            <button class="vk-key" data-key="h">h</button>
            <button class="vk-key" data-key="j">j</button>
            <button class="vk-key" data-key="k">k</button>
            <button class="vk-key" data-key="l">l</button>
          </div>
          <div class="vk-row">
            <button class="vk-key vk-action" data-key="Backspace">⌫</button>
            <button class="vk-key" data-key="z">z</button>
            <button class="vk-key" data-key="x">x</button>
            <button class="vk-key" data-key="c">c</button>
            <button class="vk-key" data-key="v">v</button>
            <button class="vk-key" data-key="b">b</button>
            <button class="vk-key" data-key="n">n</button>
            <button class="vk-key" data-key="m">m</button>
            <button class="vk-key vk-action" data-key="Enter">↵</button>
          </div>
        </div>

      </div>

      <!-- 2. 错题本视图 -->
      <div id="view-wrongbook" class="view">
        <h2 class="view-title">📕 错题本</h2>
        <p class="view-desc">连续错误两次将自动加入。连续答对三次可移除。</p>
        <div class="list-container" id="wrongbookList"></div>
      </div>

      <!-- 3. 已掌握视图 -->
      <div id="view-mastered" class="view">
        <h2 class="view-title">✅ 已掌握</h2>
        <p class="view-desc">完成学习、听写、默写三个阶段。</p>
        <div class="list-container" id="masteredList"></div>
      </div>

    </main>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ 学习计划设置</h3>
      <div class="form-group">
        <label for="goalInput">每日学习目标（词数）</label>
        <input type="number" id="goalInput" min="1" max="500" value="20">
      </div>
      
      <!-- 新增：跨设备同步 -->
      <div class="sync-section">
        <label>跨设备同步（无网络同步服务，请手动导入导出）</label>
        <div class="sync-actions">
          <button class="btn" id="exportBtn" type="button">导出进度</button>
          <button class="btn" id="importBtn" type="button">导入进度</button>
        </div>
      </div>

      <div class="modal-actions" style="margin-top: 24px;">
        <button class="btn" id="cancelSettingsBtn">取消</button>
        <button class="btn primary" id="saveSettingsBtn">保存</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/typing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
